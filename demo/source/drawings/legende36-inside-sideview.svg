<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 265" width="1000" height="265">
  <style>
    .hull { fill: #ffffff; stroke: #111111; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .line-main { fill: none; stroke: #111111; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .line-thin { fill: none; stroke: #111111; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
    .waterline { fill: none; stroke: #111111; stroke-width: 0.9; stroke-linecap: round; }
    .dark-fill { fill: #111111; stroke: none; }
  </style>

  <!-- Rumpf-Außenkontur & Kajütaufbau (Steuerbord-Schnitt) -->
